image: node:22.12.0

stages:
  - validate
  - build

default:
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: validate
  script:
    - npm run lint:check

typecheck:
  stage: validate
  script:
    - npm run typecheck

test:
  stage: validate
  script:
    - npm run test:run

coverage:
  stage: validate
  script:
    - npm run test:coverage
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

production-build:
  stage: build
  script:
    - npm run build:live
    - test -f dist/index.html
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

prelive-build:
  stage: build
  script:
    - npm run build:prelive
    - test -f dist/index.html
