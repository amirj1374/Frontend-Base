image: oven/bun:1.4.0-alpine

stages:
  - validate
  - build

default:
  cache:
    key:
      files:
        - bun.lock
    paths:
      - .bun/install/cache/
  before_script:
    - bun install --frozen-lockfile

lint:
  stage: validate
  script:
    - bun run lint:check

typecheck:
  stage: validate
  script:
    - bun run typecheck

test:
  stage: validate
  script:
    - bun run test:run

coverage:
  stage: validate
  script:
    - bun run test:coverage
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/

production-build:
  stage: build
  script:
    - bun run build:live
    - test -f dist/index.html
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

prelive-build:
  stage: build
  script:
    - bun run build:prelive
    - test -f dist/index.html
